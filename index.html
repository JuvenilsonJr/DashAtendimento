<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Chamados — Suporte Apdata</title>
  <style>
    /* Tema Escuro */
    [data-theme="dark"] {
      --primary: #7c4dff;
      --primary-light: #536dfe;
      --accent: #ffab00;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --text-muted: #9e9e9e;
      --border: #333333;
      --success: #66bb6a;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
      --header-bg: linear-gradient(135deg, #1a1a2e, #16213e);
      --section-header-bg: linear-gradient(135deg, #1a1a2e, #16213e);
      --accent-header-bg: linear-gradient(135deg, #3d2e00, #5a4000);
      --th-bg: #1a1a1a;
      --hover-bg: #2a2a3a;
      --badge-primary-bg: #2a2050;
      --badge-accent-bg: #3d2e00;
      --error-bg: #2d1515;
      --error-text: #ef5350;
    }

    /* Tema Claro */
    [data-theme="light"] {
      --primary: #1a237e;
      --primary-light: #3949ab;
      --accent: #ff6f00;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #212121;
      --text-muted: #757575;
      --border: #e0e0e0;
      --success: #2e7d32;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --header-bg: linear-gradient(135deg, #1a237e, #3949ab);
      --section-header-bg: linear-gradient(135deg, #1a237e, #3949ab);
      --accent-header-bg: linear-gradient(135deg, #ff6f00, #ff8f00);
      --th-bg: #fafafa;
      --hover-bg: #f0f4ff;
      --badge-primary-bg: #e8eaf6;
      --badge-accent-bg: #fff3e0;
      --error-bg: #ffebee;
      --error-text: #c62828;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: var(--header-bg);
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header .status {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    /* Toggle Tema */
    .theme-toggle {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.25);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Filtros */
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .filter-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-group select {
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      min-width: 260px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .filter-group select:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.15);
    }

    .btn-refresh {
      padding: 0.6rem 1.2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover { background: var(--primary-light); }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Cards de Resumo */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .summary-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 1.2rem;
      box-shadow: var(--shadow);
      text-align: center;
      border-top: 4px solid var(--primary);
      transition: background 0.3s;
    }

    .summary-card.accent { border-top-color: var(--accent); }
    .summary-card.success { border-top-color: var(--success); }

    .summary-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .summary-card.accent .number { color: var(--accent); }
    .summary-card.success .number { color: var(--success); }

    .summary-card .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Tabelas */
    .section {
      background: var(--card-bg);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      overflow: hidden;
      transition: background 0.3s;
    }

    .section-header {
      padding: 1rem 1.5rem;
      background: var(--section-header-bg);
      color: white;
      font-size: 1rem;
      font-weight: 600;
    }

    .section-header.accent-header {
      background: var(--accent-header-bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 0.8rem 1rem;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
      background: var(--th-bg);
      transition: background 0.3s;
    }

    tbody td {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover { background: var(--hover-bg); }

    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .font-bold { font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-primary { background: var(--badge-primary-bg); color: var(--primary); }
    .badge-accent { background: var(--badge-accent-bg); color: var(--accent); }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .filters { flex-direction: column; }
      .filter-group select { min-width: 100%; }
      .summary-cards { grid-template-columns: 1fr 1fr; }
      header { flex-wrap: wrap; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard de Chamados — Suporte</h1>
    <div class="header-right">
      <span class="status" id="statusText">Carregando...</span>
      <button class="theme-toggle" id="btnTheme" onclick="toggleTheme()">
        <span id="themeIcon">&#9790;</span>
        <span id="themeLabel">Claro</span>
      </button>
    </div>
  </header>

  <div class="container">
    <!-- Filtros -->
    <div class="filters">
      <div class="filter-group">
        <label>Equipe</label>
        <select id="filtroEquipe">
          <option value="">Todas as equipes</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Atendente</label>
        <select id="filtroAtendente">
          <option value="">Todos os atendentes</option>
        </select>
      </div>
      <button class="btn-refresh" id="btnRefresh" onclick="carregarDados()">Atualizar</button>
    </div>

    <!-- Erro -->
    <div class="error" id="errorBox" style="display:none"></div>

    <!-- Cards de Resumo -->
    <div class="summary-cards">
      <div class="summary-card">
        <div class="number" id="totalEquipe">-</div>
        <div class="label">Chamados Abertos (Equipe)</div>
      </div>
      <div class="summary-card accent">
        <div class="number" id="totalSemAtendente">-</div>
        <div class="label">Chamados sem Atendente</div>
      </div>
      <div class="summary-card success">
        <div class="number" id="totalHoje">-</div>
        <div class="label">Distribuidos Hoje</div>
      </div>
    </div>

    <!-- Tabela de Atendentes -->
    <div class="section">
      <div class="section-header">Chamados por Atendente</div>
      <div id="tabelaAtendentes">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando dados...</p>
        </div>
      </div>
    </div>

    <!-- Tabela de Distribuidos Hoje -->
    <div class="section">
      <div class="section-header accent-header">Chamados Distribuidos Hoje</div>
      <div id="tabelaHoje">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando dados...</p>
        </div>
      </div>
    </div>

    <!-- Top 10 Chamados com mais dias sem movimentação -->
    <div class="section">
      <div class="section-header" style="background: linear-gradient(135deg, #b71c1c, #d32f2f);">Top 10 — Chamados com Mais Tempo sem Movimentacao</div>
      <div id="tabelaDiasSemMov">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando dados...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ─── Tema ─────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').textContent = theme === 'dark' ? '\u2600' : '\u263E';
      document.getElementById('themeLabel').textContent = theme === 'dark' ? 'Claro' : 'Escuro';
      localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // Carregar tema salvo
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);

    // ─── API ──────────────────────────────────────────────────────────────────
    const WORKER_URL = 'https://apdata-dashboard-api.dashatendimento.workers.dev';
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:5000'
      : WORKER_URL;

    let dadosCache = null;

    async function carregarDados() {
      const btn = document.getElementById('btnRefresh');
      const statusText = document.getElementById('statusText');
      const errorBox = document.getElementById('errorBox');

      btn.disabled = true;
      btn.textContent = 'Carregando...';
      statusText.textContent = 'Atualizando...';
      errorBox.style.display = 'none';

      try {
        const resp = await fetch(`${API_URL}/api/dashboard`);
        if (!resp.ok) throw new Error(`Erro HTTP ${resp.status}`);
        dadosCache = await resp.json();

        if (dadosCache.error) throw new Error(dadosCache.error);

        preencherFiltros(dadosCache);
        renderizar(dadosCache);

        const agora = new Date().toLocaleTimeString('pt-BR');
        statusText.textContent = `Atualizado: ${agora}`;
      } catch (err) {
        errorBox.textContent = `Erro ao carregar dados: ${err.message}`;
        errorBox.style.display = 'block';
        statusText.textContent = 'Erro na conexao';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Atualizar';
      }
    }

    function preencherFiltros(dados) {
      const selEquipe = document.getElementById('filtroEquipe');
      const selAtendente = document.getElementById('filtroAtendente');

      const eqAtual = selEquipe.value;
      const atAtual = selAtendente.value;

      // Equipes: extrair nomes únicos
      const nomesEquipes = new Set();
      (dados.equipes || []).forEach(e => nomesEquipes.add(e.nome));
      (dados.sem_atendente || []).forEach(s => nomesEquipes.add(s.equipe));
      const equipes = [...nomesEquipes].sort();

      selEquipe.innerHTML = '<option value="">Todas as equipes</option>';
      equipes.forEach(nome => {
        const opt = document.createElement('option');
        opt.value = nome;
        opt.textContent = nome;
        selEquipe.appendChild(opt);
      });

      // Atendentes: filtrar pela equipe selecionada
      let atendentesLista = (dados.atendentes || []).map(a => a.nome);
      if (eqAtual) {
        atendentesLista = (dados.atendentes || [])
          .filter(a => a.equipe === eqAtual)
          .map(a => a.nome);
      }
      const atendentesUnicos = [...new Set(atendentesLista)].sort();

      selAtendente.innerHTML = '<option value="">Todos os atendentes</option>';
      atendentesUnicos.forEach(nome => {
        const opt = document.createElement('option');
        opt.value = nome;
        opt.textContent = nome;
        selAtendente.appendChild(opt);
      });

      if (eqAtual) selEquipe.value = eqAtual;
      if (atAtual && atendentesUnicos.includes(atAtual)) {
        selAtendente.value = atAtual;
      }
    }

    function renderizar(dados) {
      const filtroEquipe = document.getElementById('filtroEquipe').value;
      const filtroAtendente = document.getElementById('filtroAtendente').value;

      // Filtrar equipes
      let equipesFiltradas = dados.equipes || [];
      if (filtroEquipe) {
        equipesFiltradas = equipesFiltradas.filter(e => e.nome === filtroEquipe);
      }

      // Filtrar atendentes pela equipe selecionada
      let atendentesFiltrados = dados.atendentes || [];
      if (filtroEquipe) {
        atendentesFiltrados = atendentesFiltrados.filter(a => a.equipe === filtroEquipe);
      }
      if (filtroAtendente) {
        atendentesFiltrados = atendentesFiltrados.filter(a => a.nome === filtroAtendente);
      }

      const totalEq = equipesFiltradas.reduce((sum, e) => sum + e.chamados_abertos, 0);

      // Sem atendente: filtrar por equipe selecionada
      let semAtendenteFiltrado = dados.sem_atendente || [];
      if (filtroEquipe) {
        semAtendenteFiltrado = semAtendenteFiltrado.filter(s => s.equipe === filtroEquipe);
      }
      const totalSemAtendente = semAtendenteFiltrado.reduce((sum, s) => sum + s.quantidade, 0);

      const totalHoje = dados.distribuidos_hoje
        .filter(d => !filtroAtendente || d.atendente === filtroAtendente)
        .reduce((sum, d) => sum + d.chamados_novos, 0);

      document.getElementById('totalEquipe').textContent = totalEq;
      document.getElementById('totalSemAtendente').textContent = totalSemAtendente;
      document.getElementById('totalHoje').textContent = totalHoje;

      renderTabelaAtendentes(atendentesFiltrados);

      let hojeFiltrados = dados.distribuidos_hoje;
      if (filtroAtendente) {
        hojeFiltrados = hojeFiltrados.filter(d => d.atendente === filtroAtendente);
      }
      renderTabelaHoje(hojeFiltrados);

      // Top 10 dias sem movimentação
      renderTabelaDiasSemMov(dados, filtroEquipe);
    }

    function renderTabelaAtendentes(atendentes) {
      const container = document.getElementById('tabelaAtendentes');

      if (!atendentes.length) {
        container.innerHTML = '<div class="loading"><p>Nenhum atendente encontrado</p></div>';
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Atendente</th>
            <th>Equipe</th>
            <th class="text-center">Chamados Abertos</th>
          </tr>
        </thead>
        <tbody>`;

      atendentes.forEach(a => {
        html += `<tr>
          <td class="font-bold">${a.nome}</td>
          <td>${a.equipe}</td>
          <td class="text-center"><span class="badge badge-primary">${a.chamados_abertos}</span></td>
        </tr>`;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderTabelaHoje(distribuidos) {
      const container = document.getElementById('tabelaHoje');

      if (!distribuidos.length) {
        container.innerHTML = '<div class="loading"><p>Nenhum chamado distribuido hoje</p></div>';
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>Atendente</th>
            <th class="text-center">Chamados Novos Hoje</th>
            <th class="text-center">Data</th>
          </tr>
        </thead>
        <tbody>`;

      distribuidos.forEach(d => {
        html += `<tr>
          <td class="font-bold">${d.atendente}</td>
          <td class="text-center"><span class="badge badge-primary">${d.chamados_novos}</span></td>
          <td class="text-center">${d.data}</td>
        </tr>`;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderTabelaDiasSemMov(dados, filtroEquipe) {
      const container = document.getElementById('tabelaDiasSemMov');
      let lista = dados.dias_sem_movimentacao || [];

      if (filtroEquipe) {
        lista = lista.filter(d => d.equipe === filtroEquipe);
      }

      if (!lista.length) {
        container.innerHTML = '<div class="loading"><p>Nenhum chamado encontrado</p></div>';
        return;
      }

      let html = `<table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Referencia</th>
            <th>Equipe</th>
            <th>Responsavel</th>
            <th>Status</th>
            <th class="text-center">Dias sem Mov.</th>
            <th class="text-center">Dias em Aberto</th>
          </tr>
        </thead>
        <tbody>`;

      lista.forEach(d => {
        const corDias = d.dias_sem_movimentacao > 30 ? 'color: #ef5350; font-weight:700;' : '';
        html += `<tr>
          <td>${d.id_chamada}</td>
          <td>${d.referencia}</td>
          <td>${d.equipe}</td>
          <td>${d.responsavel}</td>
          <td>${d.status}</td>
          <td class="text-center" style="${corDias}">${d.dias_sem_movimentacao}</td>
          <td class="text-center">${d.dias_em_aberto}</td>
        </tr>`;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    document.getElementById('filtroEquipe').addEventListener('change', () => {
      if (dadosCache) {
        preencherFiltros(dadosCache);
        renderizar(dadosCache);
      }
    });

    document.getElementById('filtroAtendente').addEventListener('change', () => {
      if (dadosCache) renderizar(dadosCache);
    });

    // Auto-refresh a cada 5 minutos
    setInterval(carregarDados, 5 * 60 * 1000);

    // Carregar ao abrir
    carregarDados();
  </script>
</body>
</html>
